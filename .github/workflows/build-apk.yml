name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q HandGestureControl.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download MediaPipe hand model
        working-directory: HandGestureControl
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
      - name: Build debug APK
        working-directory: HandGestureControl
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HandGestureControl-debug-apk
          path: HandGestureControl/app/build/outputs/apk/debug/app-debug.apk
